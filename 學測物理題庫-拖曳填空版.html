{ch:"🔥 綜合模擬題", t:"跨章節整合", q:"關於電磁波何者正確? (需介質/是橫波/電場磁場平行/真空中速率不同)", ans:"B", opts:["A","B","C","D"]}
];

let order = QUESTIONS.map((_,i)=>i);
let email = {}; // placeholder unused

function shuffleArray(arr){ for(let i=arr.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; } return arr; }

function newRound(){
  order = shuffleArray([...Array(QUESTIONS.length).keys()]);
  render();
}

function scoreState(){ const s={done:0,correct:0}; document.querySelectorAll('.card').forEach(c=>{ const b=c.querySelector('.blank'); if(b && b.dataset.state){ s.done++; if(b.dataset.state==='correct') s.correct++; } }); return s; }

function updateScore(){
  const s=scoreState();
  document.getElementById('statTotal').textContent=QUESTIONS.length;
  document.getElementById('statDone').textContent=s.done;
  document.getElementById('statCorrect').textContent=s.correct;
  document.getElementById('statRate').textContent=(s.done?Math.round(s.correct/s.done*100):0)+'%';
  document.getElementById('scoreInfo').textContent = s.done ? ('已作答 '+s.done+' 題，答對 '+s.correct+' 題') : '把答案拖進空格開始練習';
}

function render(){
  const quiz=document.getElementById('quiz');
  quiz.innerHTML='';
  let currentCh='';
  order.forEach(idx=>{
    const q=QUESTIONS[idx];
    if(q.ch!==currentCh){ currentCh=q.ch; const h=document.createElement('h2'); h.textContent=q.ch; quiz.appendChild(h); }
    const card=document.createElement('div'); card.className='card';
    const qp=document.createElement('p'); qp.className='q';
    qp.innerHTML='<span class="chapter-tag">'+escapeHtml(q.t)+'</span> '+escapeHtml(q.q);
    card.appendChild(qp);

    const blankRow=document.createElement('div');
    const blank=document.createElement('span'); blank.className='blank'; blank.textContent=''; blank.dataset.ans=q.ans;
    blankRow.appendChild(blank);
    card.appendChild(blankRow);

    const panel=document.createElement('div'); panel.className='options-panel';
    const opts=shuffleArray(q.opts.slice());
    const optionEls={};
    opts.forEach(letter=>{
      const o=document.createElement('div'); o.className='option'; o.textContent=letter; o.draggable=true; o.dataset.letter=letter;
      o.addEventListener('dragstart',e=>{ e.dataTransfer.setData('text/plain', letter); o.classList.add('dragging'); });
      o.addEventListener('dragend',e=>{ o.classList.remove('dragging'); });
      optionEls[letter]=o;
      panel.appendChild(o);
    });
    card.appendChild(panel);

    const result=document.createElement('div'); result.className='result';
    const btn=document.createElement('button'); btn.className='check-btn'; btn.textContent='對答案';

    blank.addEventListener('dragover',e=>e.preventDefault());
    blank.addEventListener('drop',e=>{
      e.preventDefault();
      const letter=e.dataTransfer.getData('text/plain');
      blank.textContent=letter; blank.className='blank dropped'; blank.dataset.state='filled';
      if(optionEls[letter]){ optionEls[letter].classList.add('used'); }
      updateScore();
    });

    btn.addEventListener('click',()=>{
      const val=blank.textContent; const ans=blank.dataset.ans;
      if(!val) return;
      if(val===ans){ blank.className='blank correct'; blank.dataset.state='correct'; result.innerHTML='<span class="ok">✅ 答對了！</span>'; }
      else { blank.className='blank wrong'; blank.dataset.state='wrong'; result.innerHTML='<span class="bad">❌ 答錯了，正確答案為 '+ans+'</span>'; }
      btn.disabled=true;
      updateScore();
    });

    card.appendChild(btn);
    card.appendChild(result);

    const hint=document.createElement('div'); hint.className='hint';
    hint.textContent='提示：選項為各題的答案代號，請拖曳正確代號填入空格';
    card.appendChild(hint);

    quiz.appendChild(card);
  });
  updateScore();
}

function resetAll(){
  document.querySelectorAll('.card').forEach(c=>{
    const b=c.querySelector('.blank'); if(b){ b.textContent=''; b.className='blank'; delete b.dataset.state; }
    c.querySelectorAll('.option').forEach(o=>o.classList.remove('used'));
    const r=c.querySelector('.result'); if(r) r.textContent='';
    const btn=c.querySelector('.check-btn'); if(btn){ btn.disabled=false; }
  });
  updateScore();
}

function escapeHtml(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

render();
</script>
</body>
</html>
