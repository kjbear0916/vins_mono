; PlatformIO 環境設定 - ESP32-S3-EYE / GOOUUU ESP32-S3-CAM (OV2640/OV3660)
; 由這台電腦編譯燒錄,繞過筆電壞掉的 Arduino IDE

[platformio]
src_dir = .

[env:esp32s3eye]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
board_build.partitions = partitions.csv
board_build.arduino.memory_type = qio_opi
monitor_speed = 115200
upload_port = COM11

lib_deps =
    espressif/esp32-camera

build_flags =
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=3