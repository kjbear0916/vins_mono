<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>自主搜救無人機 3D 展示</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #05070a; font-family: -apple-system, "Microsoft JhengHei", sans-serif; }
  #canvas-container { width: 100vw; height: 100vh; display: block; }

  .panel {
    background: linear-gradient(160deg, rgba(18,24,34,0.92), rgba(10,14,20,0.92));
    border: 1px solid rgba(120,160,220,0.18);
    border-radius: 12px;
    backdrop-filter: blur(8px);
    box-shadow: 0 8px 24px rgba(0,0,0,0.35);
    color: #e8edf5;
  }

  #ui {
    position: absolute; top: 16px; left: 16px;
    padding: 16px 20px;
    width: 280px;
  }
  #ui h1 { font-size: 14px; margin: 0 0 12px 0; font-weight: 600; letter-spacing: 0.6px; color: #cfe0f5; text-transform: uppercase; }
  #ui .row { display: flex; justify-content: space-between; margin: 7px 0; font-size: 13px; }
  #ui .row .label { color: #7d90a8; }
  #ui .row .value { font-weight: 600; }
  #ui .legend { display: flex; align-items: center; gap: 8px; margin: 5px 0; font-size: 12px; color: #b8c4d4; }
  #ui .swatch { width: 16px; height: 4px; border-radius: 3px; display: inline-block; }
  #ui hr { border: none; border-top: 1px solid rgba(255,255,255,0.08); margin: 12px 0; }
  #errchart { width: 100%; margin-top: 6px; display: block; border-radius: 8px; }

  #nav-panel {
    position: absolute; top: 16px; right: 16px;
    padding: 16px 20px;
    width: 240px;
  }
  #nav-panel h1 { font-size: 14px; margin: 0 0 12px 0; font-weight: 600; letter-spacing: 0.6px; color: #ffd166; text-transform: uppercase; }
  #nav-target { font-size: 28px; font-weight: 700; color: #ffd166; margin: 4px 0; }
  #nav-dist { font-size: 15px; color: #e8edf5; margin: 4px 0; }
  #nav-status { font-size: 12px; padding: 4px 10px; border-radius: 20px; display: inline-block; margin-top: 6px; }
  .status-enroute { background: rgba(90,156,214,0.25); color: #7db8ea; }
  .status-arrived { background: rgba(79,214,122,0.25); color: #6be095; }
  @keyframes panelFlash { 0% { box-shadow: 0 0 0 rgba(79,224,138,0); } 30% { box-shadow: 0 0 30px rgba(79,224,138,0.95); } 100% { box-shadow: 0 0 0 rgba(79,224,138,0); } }
  #nav-panel.flash { animation: panelFlash 0.32s ease-out; }

  #controls {
    position: absolute; bottom: 16px; left: 16px; right: 16px;
    padding: 12px 18px;
    display: flex; align-items: center; gap: 14px;
  }
  #controls button {
    background: rgba(45,65,95,0.7); color: #e8edf5; border: 1px solid rgba(120,160,220,0.25);
    border-radius: 7px; padding: 9px 16px; font-size: 13px; cursor: pointer; transition: 0.15s;
  }
  #controls button:hover { background: rgba(65,95,135,0.85); }
  #controls button.active { background: #3d7ab5; border-color: #6bb0e8; }
  #controls input[type=range] { flex: 1; accent-color: #5a9cd6; }
  #controls .time-label { font-size: 12px; color: #7d90a8; min-width: 70px; text-align: right; }
  #mode-toggle { display: flex; gap: 6px; }

  #hint {
    position: absolute; bottom: 78px; right: 16px;
    background: rgba(10,14,20,0.6);
    border-radius: 8px; padding: 7px 12px;
    color: #7d90a8; font-size: 11px;
  }
</style>
</head>
<body>

<div id="canvas-container"></div>

<div id="ui" class="panel">
  <h1>自主搜救任務 — 定位與導航</h1>
  <div class="legend"><span class="swatch" style="background:#ff5c5c;"></span> 純 VO（未校正，會累積漂移）</div>
  <div class="legend"><span class="swatch" style="background:#4fe08a;"></span> VO + Marker 校正（絕對定位）</div>
  <div class="legend"><span class="swatch" style="background:#ffd166;"></span> ArUco Marker</div>
  <hr>
  <div class="row"><span class="label">目前幀數</span><span class="value" id="stat-frame">0 / 0</span></div>
  <div class="row"><span class="label">定位誤差 純VO</span><span class="value" id="stat-vo-err">-- m</span></div>
  <div class="row"><span class="label">定位誤差 校正後</span><span class="value" id="stat-corr-err">-- m</span></div>
  <hr>
  <div style="font-size:11px;color:#7d90a8;margin-bottom:2px;">定位品質 (m)</div>
  <canvas id="errchart" width="250" height="84"></canvas>
</div>

<div id="nav-panel" class="panel">
  <h1>搜救任務</h1>
  <div style="font-size:11px;color:#7d90a8;">目前前往搜救區</div>
  <div id="nav-target">--</div>
  <div id="nav-dist">距目標 -- m</div>
  <div id="nav-status" class="status-enroute">待命</div>
</div>

<div id="hint">拖曳旋轉・滾輪縮放・右鍵平移・◎=相機跟隨無人機</div>

<div id="controls" class="panel">
  <div id="mode-toggle">
    <button id="btn-static" class="active">靜態顯示</button>
    <button id="btn-play">▶ 動畫播放</button>
  </div>

  <input type="range" id="scrub" min="0" max="100" value="100">
  <span class="time-label" id="time-label">100%</span>
</div>

<script>
const DATA = window.__VO_DATA__;
const ROOM = DATA.room;
const MARKERS = DATA.markers;
const GT = DATA.ground_truth;
const VO = DATA.vo_trajectory;
const CORR = DATA.corrected_trajectory;
const WAYPOINTS = DATA.waypoints || [];
const N = GT.length;

function toScene(p) { return new THREE.Vector3(p[0], p[2], -p[1]); }
function objToScene(o) { return new THREE.Vector3(o.x, o.z, -o.y); }

// ---------------- 場景 ----------------
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x05070a);
scene.fog = new THREE.Fog(0x05070a, 8, 22);

const container = document.getElementById('canvas-container');
const camera = new THREE.PerspectiveCamera(52, window.innerWidth / window.innerHeight, 0.05, 100);
camera.position.set(ROOM.width * 1.5, ROOM.height * 2.3, ROOM.depth * 2.1);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.physicallyCorrectLights = true;
renderer.outputEncoding = THREE.sRGBEncoding;
container.appendChild(renderer.domElement);

// ---------------- 燈光 ----------------
scene.add(new THREE.AmbientLight(0x8899bb, 0.55));
const keyLight = new THREE.DirectionalLight(0xffffff, 1.1);
keyLight.position.set(ROOM.width * 0.6, ROOM.height * 3, -ROOM.depth * 0.3);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(1024, 1024);
scene.add(keyLight);
const fillLight = new THREE.PointLight(0x5a9cd6, 0.5, 12);
fillLight.position.set(0, ROOM.height * 1.5, -ROOM.depth * 0.5);
scene.add(fillLight);

// ---------------- 房間:半透明地板 + 牆壁 ----------------
const roomCx = ROOM.width / 2, roomCz = -ROOM.depth / 2;

const floorMat = new THREE.MeshPhysicalMaterial({
  color: 0x1a2740, transparent: true, opacity: 0.55,
  roughness: 0.35, metalness: 0.1, side: THREE.DoubleSide,
});
const floor = new THREE.Mesh(new THREE.PlaneGeometry(ROOM.width, ROOM.depth), floorMat);
floor.rotation.x = -Math.PI / 2;
floor.position.set(roomCx, 0, roomCz);
floor.receiveShadow = true;
scene.add(floor);

// 任務分區網格(2x2):外框 + 中線 + 區域名稱標籤
const fv = (x, z) => new THREE.Vector3(x, 0.015, z);
function grpLine(pairs, color, opacity) {
  const g = new THREE.BufferGeometry().setFromPoints(pairs);
  const l = new THREE.LineSegments(g, new THREE.LineBasicMaterial({ color, transparent: true, opacity }));
  return l;
}
const zoneBorder = grpLine([
  fv(0, -ROOM.depth), fv(ROOM.width, -ROOM.depth),
  fv(ROOM.width, -ROOM.depth), fv(ROOM.width, 0),
  fv(ROOM.width, 0), fv(0, 0),
  fv(0, 0), fv(0, -ROOM.depth),
], 0x6b9fd4, 0.75);
scene.add(zoneBorder);
const zoneMid = grpLine([
  fv(ROOM.width / 2, -ROOM.depth), fv(ROOM.width / 2, 0),
  fv(0, -ROOM.depth / 2), fv(ROOM.width, -ROOM.depth / 2),
], 0x4a6fa5, 0.45);
scene.add(zoneMid);
const zoneRows = [['SAR-A', 'SAR-B'], ['SAR-C', 'SAR-D']];
zoneRows.flat().forEach((z, i) => {
  const half = ROOM.width / 4, qd = ROOM.depth / 4;
  const col = i % 2, row = (i / 2) | 0;
  const s = makeLabelSprite(z, '#6b9fd4');
  s.scale.set(0.32, 0.16, 1);
  s.position.set(half + col * ROOM.width / 2, 0.06, -qd - row * ROOM.depth / 2);
  scene.add(s);
});

// 瓦礫殘骸(低多邊形雜物堆),純程序化無外部資產
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const prng = mulberry32(20260915);
const debrisMats = [0x4a4038, 0x5c5248, 0x6b6157, 0x3d352c].map(c => new THREE.MeshStandardMaterial({ color: c, roughness: 0.95, metalness: 0.05 }));
for (let i = 0; i < 14; i++) {
  const w = 0.35 + prng() * 0.75, h = 0.18 + prng() * 0.5, d = 0.35 + prng() * 0.75;
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), debrisMats[(prng() * debrisMats.length) | 0]);
  m.position.set(0.25 + prng() * (ROOM.width - 0.5), h / 2, -ROOM.depth + 0.3 + prng() * (ROOM.depth - 0.6));
  m.rotation.set(prng() * 0.16 - 0.08, prng() * Math.PI, prng() * 0.16 - 0.08);
  m.castShadow = true;
  m.receiveShadow = true;
  scene.add(m);
}

// 碎石
const rubbleMat = new THREE.MeshStandardMaterial({ color: 0x55524b, roughness: 1, metalness: 0 });
for (let i = 0; i < 40; i++) {
  const s = 0.03 + prng() * 0.07;
  const m = new THREE.Mesh(new THREE.TetrahedronGeometry(s, 0), rubbleMat);
  m.position.set(prng() * ROOM.width, s * 0.4, -prng() * ROOM.depth);
  m.rotation.set(prng() * Math.PI, prng() * Math.PI, prng() * Math.PI);
  scene.add(m);
}

// 塵霧粒子(漂浮微塵)
const DUST_N = 220;
const dustPos = new Float32Array(DUST_N * 3);
const dustVel = new Float32Array(DUST_N * 3);
for (let i = 0; i < DUST_N; i++) {
  dustPos[i * 3] = prng() * ROOM.width;
  dustPos[i * 3 + 1] = prng() * ROOM.height;
  dustPos[i * 3 + 2] = -prng() * ROOM.depth;
  dustVel[i * 3] = (prng() - 0.5) * 0.05;
  dustVel[i * 3 + 1] = (prng() - 0.3) * 0.03;
  dustVel[i * 3 + 2] = (prng() - 0.5) * 0.05;
}
const dustGeo = new THREE.BufferGeometry();
dustGeo.setAttribute('position', new THREE.BufferAttribute(dustPos, 3));
const dustMat = new THREE.PointsMaterial({ color: 0xb8c4d4, size: 0.022, transparent: true, opacity: 0.22, depthWrite: false });
const dust = new THREE.Points(dustGeo, dustMat);
scene.add(dust);

const wallMat = new THREE.MeshPhysicalMaterial({
  color: 0x2c4066, transparent: true, opacity: 0.16,
  roughness: 0.5, metalness: 0.0, side: THREE.DoubleSide, depthWrite: false,
});
function addWall(w, h, x, y, z, rotY) {
  const wall = new THREE.Mesh(new THREE.PlaneGeometry(w, h), wallMat);
  wall.position.set(x, y, z);
  wall.rotation.y = rotY;
  scene.add(wall);
}
// 後牆、左牆、右牆(前牆不畫,避免遮住視角)
addWall(ROOM.width, ROOM.height, roomCx, ROOM.height / 2, -ROOM.depth, 0);
addWall(ROOM.depth, ROOM.height, 0, ROOM.height / 2, roomCz, Math.PI / 2);
addWall(ROOM.depth, ROOM.height, ROOM.width, ROOM.height / 2, roomCz, Math.PI / 2);

// 房間邊界細線(讓輪廓更清楚)
const roomEdges = new THREE.EdgesGeometry(new THREE.BoxGeometry(ROOM.width, ROOM.height, ROOM.depth));
const roomLine = new THREE.LineSegments(roomEdges, new THREE.LineBasicMaterial({ color: 0x5a9cd6, transparent: true, opacity: 0.4 }));
roomLine.position.set(roomCx, ROOM.height / 2, roomCz);
scene.add(roomLine);

// ---------------- Marker:立體菱形+發光標籤 ----------------
function makeLabelSprite(text, color) {
  const canvas = document.createElement('canvas');
  canvas.width = 160; canvas.height = 80;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = 'rgba(10,14,20,0.85)';
  roundRect(ctx, 4, 4, 152, 72, 12); ctx.fill();
  ctx.strokeStyle = color; ctx.lineWidth = 3;
  roundRect(ctx, 4, 4, 152, 72, 12); ctx.stroke();
  ctx.fillStyle = color;
  ctx.font = 'bold 40px sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(text, canvas.width / 2, canvas.height / 2);
  const tex = new THREE.CanvasTexture(canvas);
  const mat = new THREE.SpriteMaterial({ map: tex, depthTest: false, transparent: true });
  const sprite = new THREE.Sprite(mat);
  sprite.scale.set(0.42, 0.21, 1);
  return sprite;
}
function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

const markerMeshes = [];
MARKERS.forEach(m => {
  const pos = objToScene(m);
  const geo = new THREE.OctahedronGeometry(0.09, 0);
  const mat = new THREE.MeshStandardMaterial({ color: 0xffd166, emissive: 0xaa7a1a, emissiveIntensity: 0.5, roughness: 0.3, metalness: 0.4 });
  const oct = new THREE.Mesh(geo, mat);
  oct.position.copy(pos);
  oct.castShadow = true;
  scene.add(oct);
  markerMeshes.push(oct);

  const label = makeLabelSprite('#' + m.id, '#ffd166');
  label.position.set(pos.x, pos.y + 0.28, pos.z);
  scene.add(label);
});

// ---------------- 航點:柱狀光標 + 標籤 ----------------
const waypointObjs = [];
WAYPOINTS.forEach((wp, i) => {
  const pos = objToScene(wp);
  const ringGeo = new THREE.TorusGeometry(0.14, 0.015, 8, 32);
  const ringMat = new THREE.MeshStandardMaterial({ color: 0x8fd6ff, emissive: 0x2a5a7a, emissiveIntensity: 0.6, transparent: true, opacity: 0.85 });
  const ring = new THREE.Mesh(ringGeo, ringMat);
  ring.position.copy(pos);
  ring.rotation.x = Math.PI / 2;
  scene.add(ring);

  const beamGeo = new THREE.CylinderGeometry(0.008, 0.008, ROOM.height * 0.8, 8);
  const beamMat = new THREE.MeshBasicMaterial({ color: 0x8fd6ff, transparent: true, opacity: 0.25 });
  const beam = new THREE.Mesh(beamGeo, beamMat);
  beam.position.set(pos.x, ROOM.height * 0.4, pos.z);
  scene.add(beam);

  const label = makeLabelSprite(wp.label, '#8fd6ff');
  label.position.set(pos.x, pos.y + 0.32, pos.z);
  scene.add(label);

  waypointObjs.push({ ring, beam, label, pos: [wp.x, wp.y, wp.z], sceneP: pos });
});

// ---------------- 軌跡線 ----------------
function makeTrajLine(points3d, color) {
  const pts = points3d.map(toScene);
  const geo = new THREE.BufferGeometry().setFromPoints(pts);
  const mat = new THREE.LineBasicMaterial({ color, transparent: true, opacity: 0.85, linewidth: 2 });
  return new THREE.Line(geo, mat);
}
const voLine = makeTrajLine(VO, 0xff5c5c);
const corrLine = makeTrajLine(CORR, 0x4fe08a);
scene.add(voLine);
scene.add(corrLine);

function makeIndicator(color) {
  const group = new THREE.Group();
  const cone = new THREE.Mesh(
    new THREE.ConeGeometry(0.055, 0.16, 16),
    new THREE.MeshStandardMaterial({ color, emissive: color, emissiveIntensity: 0.7, roughness: 0.3 })
  );
  cone.castShadow = true;
  group.add(cone);
  const glow = new THREE.PointLight(color, 0.6, 1.2);
  group.add(glow);
  return group;
}
const voDot = makeIndicator(0xff5c5c);
scene.add(voDot);

// ---------------- 無人機草模(作為校正後位置的追蹤體) ----------------
function buildDrone() {
  const g = new THREE.Group();
  const body = new THREE.Mesh(
    new THREE.BoxGeometry(0.16, 0.055, 0.10),
    new THREE.MeshStandardMaterial({ color: 0x22313f, roughness: 0.55, metalness: 0.35 })
  );
  body.castShadow = true;
  g.add(body);
  const armMat = new THREE.MeshStandardMaterial({ color: 0x2f4258, roughness: 0.7, metalness: 0.2 });
  g.add(new THREE.Mesh(new THREE.BoxGeometry(0.30, 0.018, 0.03), armMat));
  g.add(new THREE.Mesh(new THREE.BoxGeometry(0.03, 0.018, 0.30), armMat));
  const rotorMat = new THREE.MeshBasicMaterial({ color: 0x6fd8ff, transparent: true, opacity: 0.22, depthWrite: false });
  const bladeMat = new THREE.MeshBasicMaterial({ color: 0xd8f2ff, transparent: true, opacity: 0.8 });
  const rr = 0.10;
  const rotorPos = [[-0.13, 0, -0.13], [0.13, 0, -0.13], [-0.13, 0, 0.13], [0.13, 0, 0.13]];
  g.rotors = [];
  rotorPos.forEach((rp) => {
    const r = new THREE.Group();
    r.add(new THREE.Mesh(new THREE.CylinderGeometry(rr, rr, 0.004, 20), rotorMat));
    r.add(new THREE.Mesh(new THREE.BoxGeometry(rr * 2, 0.003, 0.015), bladeMat));
    r.add(new THREE.Mesh(new THREE.BoxGeometry(0.015, 0.003, rr * 2), bladeMat));
    r.position.set(rp[0], rp[1], rp[2]);
    g.add(r);
    g.rotors.push(r);
  });
  const glow = new THREE.PointLight(0x4fe08a, 0.55, 1.5);
  g.add(glow);
  return g;
}
const drone = buildDrone();
scene.add(drone);

// ---------------- 方向指示箭頭(從校正後位置指向目前目標航點) ----------------
const dirArrow = new THREE.ArrowHelper(
  new THREE.Vector3(1, 0, 0), new THREE.Vector3(0, 0, 0), 0.6, 0xffd166, 0.18, 0.09
);
scene.add(dirArrow);

// ---------------- 簡易滑鼠軌道控制 ----------------
let isDragging = false, isPanning = false, lastX = 0, lastY = 0;
let camTarget = new THREE.Vector3(roomCx, ROOM.height / 2, roomCz);
let camDistance = camera.position.distanceTo(camTarget);
let camTheta = Math.atan2(camera.position.x - camTarget.x, camera.position.z - camTarget.z);
let camPhi = Math.acos((camera.position.y - camTarget.y) / camDistance);

function updateCameraFromSpherical() {
  const x = camTarget.x + camDistance * Math.sin(camPhi) * Math.sin(camTheta);
  const y = camTarget.y + camDistance * Math.cos(camPhi);
  const z = camTarget.z + camDistance * Math.sin(camPhi) * Math.cos(camTheta);
  camera.position.set(x, y, z);
  camera.lookAt(camTarget);
}
updateCameraFromSpherical();

renderer.domElement.addEventListener('mousedown', (e) => {
  if (e.button === 0) isDragging = true;
  if (e.button === 2) isPanning = true;
  lastX = e.clientX; lastY = e.clientY;
});
window.addEventListener('mouseup', () => { isDragging = false; isPanning = false; });
window.addEventListener('mousemove', (e) => {
  const dx = e.clientX - lastX, dy = e.clientY - lastY;
  lastX = e.clientX; lastY = e.clientY;
  if (isDragging) {
    camTheta -= dx * 0.006;
    camPhi -= dy * 0.006;
    camPhi = Math.max(0.15, Math.min(Math.PI - 0.15, camPhi));
    updateCameraFromSpherical();
  } else if (isPanning) {
    const panSpeed = camDistance * 0.0015;
    const right = new THREE.Vector3(); camera.getWorldDirection(right); right.cross(camera.up).normalize();
    camTarget.addScaledVector(right, -dx * panSpeed);
    camTarget.y += dy * panSpeed;
    updateCameraFromSpherical();
  }
});
renderer.domElement.addEventListener('contextmenu', (e) => e.preventDefault());
renderer.domElement.addEventListener('wheel', (e) => {
  camDistance *= (1 + e.deltaY * 0.001);
  camDistance = Math.max(0.5, Math.min(30, camDistance));
  updateCameraFromSpherical();
});
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ---------------- 導航邏輯 ----------------
const ARRIVE_THRESHOLD = 0.35; // 公尺,小於此距離視為到達航點
let currentWaypointIdx = 0;

function euclid(a, b) { return Math.sqrt((a[0]-b[0])**2 + (a[1]-b[1])**2 + (a[2]-b[2])**2); }

function updateNavigation(corrPos) {
  if (WAYPOINTS.length === 0) return;
  let wp = WAYPOINTS[currentWaypointIdx];
  let dist = euclid(corrPos, [wp.x, wp.y, wp.z]);

  const navTargetEl = document.getElementById('nav-target');
  const navDistEl = document.getElementById('nav-dist');
  const navStatusEl = document.getElementById('nav-status');

  if (dist < ARRIVE_THRESHOLD) {
    navStatusEl.textContent = '掃描完成';
    navStatusEl.className = 'status-arrived';
    if (!arrivedFired) {
      arrivedFired = true;
      hoverHold = performance.now() + HOVER_MS;
      const pnl = document.getElementById('nav-panel');
      pnl.classList.remove('flash'); void pnl.offsetWidth; pnl.classList.add('flash');
    }
    if (currentWaypointIdx < WAYPOINTS.length - 1) {
      currentWaypointIdx++;
      wp = WAYPOINTS[currentWaypointIdx];
      dist = euclid(corrPos, [wp.x, wp.y, wp.z]);
    }
  } else {
    arrivedFired = false;
    navStatusEl.textContent = '前往目標';
    navStatusEl.className = 'status-enroute';
  }

  navTargetEl.textContent = wp.label;
  navDistEl.textContent = `距目標 ${dist.toFixed(2)} m`;

  // 更新方向箭頭:從目前校正位置指向目標航點(在水平面上的方向)
  const fromP = objToScene({x: corrPos[0], y: corrPos[1], z: corrPos[2] + 0.02});
  const toP = objToScene(wp);
  const dir = new THREE.Vector3().subVectors(toP, fromP);
  dir.y = 0;
  if (dir.length() > 0.001) {
    dir.normalize();
    dirArrow.position.copy(fromP);
    dirArrow.position.y += 0.12;
    dirArrow.setDirection(dir);
    dirArrow.setLength(Math.min(0.8, Math.max(0.35, dist * 0.4)), 0.16, 0.08);
  }
}

// ---------------- 模式切換:靜態 vs 動畫播放 ----------------
let mode = 'static';
let playFrame = 0;
let playing = false;
let lastPlayTime = 0;

const btnStatic = document.getElementById('btn-static');
const btnPlay = document.getElementById('btn-play');
const scrub = document.getElementById('scrub');
const timeLabel = document.getElementById('time-label');

// ---------------- 無人機姿態 / marker 命中 ----------------
const MARKER_HIT_DIST = 0.6;   // 公尺,校正位置進入此半徑就觸發 marker 閃光
let hitMarker = -1;
let hitTime = 0;

// ---------------- 懸停掃描 & 探照燈 ----------------
const HOVER_MS = 550;        // 抵達航點後的"懸停掃描"時間
let hoverHold = 0;           // 懸停結束時點(performance.now),抵達時啟動
let arrivedFired = false;    // 避免同一航點重複觸發掃描/閃光
const scanRing = new THREE.Mesh(
  new THREE.RingGeometry(0.82, 1, 48),
  new THREE.MeshBasicMaterial({ color: 0x4fe08a, transparent: true, opacity: 0, side: THREE.DoubleSide, depthWrite: false })
);
scanRing.rotation.x = -Math.PI / 2;
scanRing.position.y = 0.05;
scene.add(scanRing);
const searchCone = new THREE.Mesh(
  new THREE.CylinderGeometry(0.05, 0.12, 0.18, 16, 1, true),
  new THREE.MeshBasicMaterial({ color: 0xbfe3ff, transparent: true, opacity: 0.32, side: THREE.DoubleSide, depthWrite: false })
);
scene.add(searchCone);
const searchLight = new THREE.SpotLight(0xbfe3ff, 0.9, 7, Math.PI / 5, 0.6, 1.6);
const searchTarget = new THREE.Object3D();
scene.add(searchLight, searchTarget);
searchLight.target = searchTarget;

function setDronePose(frameIdx) {
  drone.position.copy(toScene(CORR[frameIdx]));
  const a = Math.max(0, frameIdx - 1), b = Math.min(N - 1, frameIdx + 1);
  const v = new THREE.Vector3().subVectors(toScene(CORR[b]), toScene(CORR[a]));
  v.y = 0;
  if (v.length() > 1e-4) {
    drone.rotation.y = Math.atan2(v.x, v.z);
  }
  let best = -1, bestD = MARKER_HIT_DIST;
  for (let k = 0; k < MARKERS.length; k++) {
    const d = euclid(CORR[frameIdx], [MARKERS[k].x, MARKERS[k].y, MARKERS[k].z]);
    if (d < bestD) { bestD = d; best = k; }
  }
  if (best >= 0) { hitMarker = best; hitTime = performance.now(); }

  // 探照燈隨機身移動並照向正下方
  searchLight.position.copy(drone.position).y -= 0.08;
  searchTarget.position.set(drone.position.x, 0.02, drone.position.z);
  searchCone.position.copy(drone.position).y -= 0.14;
  searchCone.rotation.copy(drone.rotation);
}

function updateStatsAt(frameIdx) {
  const gt = GT[frameIdx], vo = VO[frameIdx], corr = CORR[frameIdx];
  document.getElementById('stat-frame').textContent = `${frameIdx + 1} / ${N}`;
  document.getElementById('stat-vo-err').textContent = euclid(vo, gt).toFixed(3) + ' m';
  document.getElementById('stat-corr-err').textContent = euclid(corr, gt).toFixed(3) + ' m';
  updateNavigation(corr);
  drawErrChart(frameIdx);
}

// ---------------- 誤差走勢圖 ----------------
const errCanvas = document.getElementById('errchart');
const errCtx = errCanvas.getContext('2d');
const errW = errCanvas.width, errH = errCanvas.height;
const errVOa = new Array(N), errCorra = new Array(N);
let errOverallMax = 0;
for (let i = 0; i < N; i++) {
  errVOa[i] = euclid(VO[i], GT[i]);
  errCorra[i] = euclid(CORR[i], GT[i]);
  if (errVOa[i] > errOverallMax) errOverallMax = errVOa[i];
  if (errCorra[i] > errOverallMax) errOverallMax = errCorra[i];
}
const YMAX = Math.max(0.1, Math.ceil(errOverallMax * 1.15 * 10) / 10);
function drawErrChart(cur) {
  const padL = 30, padB = 13, padT = 5, padR = 5;
  const w = errW - padL - padR, h = errH - padT - padB;
  errCtx.clearRect(0, 0, errW, errH);
  errCtx.fillStyle = 'rgba(10,14,20,0.6)';
  errCtx.fillRect(0, 0, errW, errH);
  errCtx.font = '9px sans-serif';
  errCtx.textAlign = 'right';
  errCtx.textBaseline = 'middle';
  const steps = 4;
  for (let s = 0; s <= steps; s++) {
    const yv = YMAX * s / steps;
    const y = padT + h - (s / steps) * h;
    errCtx.strokeStyle = 'rgba(140,170,210,0.16)';
    errCtx.lineWidth = 1;
    errCtx.beginPath(); errCtx.moveTo(padL, y); errCtx.lineTo(errW - padR, y); errCtx.stroke();
    errCtx.fillStyle = '#7d90a8';
    errCtx.fillText(yv.toFixed(1), padL - 4, y);
  }
  errCtx.fillText('0', padL - 4, errH - padB + 4);
  function plot(arr, color) {
    errCtx.beginPath();
    for (let i = 0; i < arr.length; i++) {
      const x = padL + (i / (N - 1)) * w;
      const y = padT + h - (Math.min(arr[i], YMAX) / YMAX) * h;
      if (i === 0) errCtx.moveTo(x, y); else errCtx.lineTo(x, y);
    }
    errCtx.strokeStyle = color;
    errCtx.lineWidth = 1.5;
    errCtx.stroke();
  }
  plot(errVOa, '#ff5c5c');
  plot(errCorra, '#4fe08a');
  if (cur != null) {
    const x = padL + (cur / (N - 1)) * w;
    errCtx.strokeStyle = 'rgba(230,240,255,0.85)';
    errCtx.beginPath(); errCtx.moveTo(x, padT); errCtx.lineTo(x, padT + h); errCtx.stroke();
  }
}

function setFrame(frameIdx) {
  frameIdx = Math.max(0, Math.min(N - 1, frameIdx));
  playFrame = frameIdx;
  voDot.position.copy(toScene(VO[frameIdx]));
  setDronePose(frameIdx);
  const voPts = VO.slice(0, frameIdx + 1).map(toScene);
  const corrPts = CORR.slice(0, frameIdx + 1).map(toScene);
  voLine.geometry.setFromPoints(voPts.length > 1 ? voPts : [toScene(VO[0]), toScene(VO[0])]);
  corrLine.geometry.setFromPoints(corrPts.length > 1 ? corrPts : [toScene(CORR[0]), toScene(CORR[0])]);
  scrub.value = Math.round((frameIdx / (N - 1)) * 100);
  timeLabel.textContent = `${frameIdx + 1}/${N}`;
  updateStatsAt(frameIdx);
}

function setStaticMode() {
  mode = 'static';
  playing = false;
  hoverHold = 0;
  arrivedFired = false;
  scanRing.material.opacity = 0;
  currentWaypointIdx = 0;
  btnStatic.classList.add('active');
  btnPlay.classList.remove('active');
  btnPlay.textContent = '▶ 動畫播放';
  voLine.geometry.setFromPoints(VO.map(toScene));
  corrLine.geometry.setFromPoints(CORR.map(toScene));
  const lastIdx = Math.round((scrub.value / 100) * (N - 1));
  voDot.position.copy(toScene(VO[lastIdx]));
  setDronePose(lastIdx);
  updateStatsAt(lastIdx);
  timeLabel.textContent = scrub.value + '%';
}

btnStatic.addEventListener('click', setStaticMode);
btnPlay.addEventListener('click', () => {
  if (mode !== 'play') {
    mode = 'play';
    hoverHold = 0;
    arrivedFired = false;
    scanRing.material.opacity = 0;
    btnPlay.classList.add('active');
    btnStatic.classList.remove('active');
    playFrame = 0;
    currentWaypointIdx = 0;
  }
  playing = !playing;
  btnPlay.textContent = playing ? '⏸ 暫停' : '▶ 繼續播放';
  lastPlayTime = performance.now();
});
scrub.addEventListener('input', () => {
  if (mode === 'static') {
    const idx = Math.round((scrub.value / 100) * (N - 1));
    voDot.position.copy(toScene(VO[idx]));
    setDronePose(idx);
    updateStatsAt(idx);
    timeLabel.textContent = scrub.value + '%';
  } else {
    playing = false;
    btnPlay.textContent = '▶ 繼續播放';
    setFrame(Math.round((scrub.value / 100) * (N - 1)));
  }
});

// ---------------- 相機跟隨無人機 ----------------
let followCam = false;
const btnFollow = document.getElementById('btn-follow');
btnFollow.addEventListener('click', () => {
  followCam = !followCam;
  btnFollow.classList.toggle('active', followCam);
});

setStaticMode();

// ---------------- 主渲染迴圈 ----------------
const FRAME_INTERVAL_MS = 40;
function animate(now) {
  requestAnimationFrame(animate);

  // 航點光環緩慢旋轉+呼吸感,增加視覺精緻度
  waypointObjs.forEach((w, i) => {
    w.ring.rotation.z += 0.01;
    const pulse = 1 + Math.sin(now * 0.002 + i) * 0.08;
    w.ring.scale.set(pulse, pulse, pulse);
  });

  // 塵霧粒子漂移(邊界內迴繞)
  {
    const dp = dust.geometry.attributes.position;
    const arr = dp.array;
    for (let i = 0; i < arr.length / 3; i++) {
      arr[i * 3] += dustVel[i * 3];
      if (arr[i * 3] < 0) arr[i * 3] += ROOM.width;
      if (arr[i * 3] > ROOM.width) arr[i * 3] -= ROOM.width;
      arr[i * 3 + 1] += dustVel[i * 3 + 1];
      if (arr[i * 3 + 1] < 0) arr[i * 3 + 1] += ROOM.height;
      if (arr[i * 3 + 1] > ROOM.height) arr[i * 3 + 1] -= ROOM.height;
      arr[i * 3 + 2] += dustVel[i * 3 + 2];
      if (arr[i * 3 + 2] > 0) arr[i * 3 + 2] -= ROOM.depth;
      if (arr[i * 3 + 2] < -ROOM.depth) arr[i * 3 + 2] += ROOM.depth;
    }
    dp.needsUpdate = true;
  }

  // 旋翼旋轉(懸停掃描時明顯降速)
  drone.rotors.forEach((r) => { r.rotation.y += hoverHold ? 0.14 : 0.6; });

  // 被命中 marker 的閃光(縮放脈衝 + 自發光增強)
  if (hitMarker >= 0) {
    const mesh = markerMeshes[hitMarker];
    const t = now - hitTime;
    if (t < 700) {
      mesh.scale.setScalar(1 + 0.7 * Math.exp(-t * 0.005));
      mesh.material.emissiveIntensity = 0.5 + 1.6 * Math.exp(-t * 0.006);
    } else if (mesh.scale.x !== 1) {
      mesh.scale.setScalar(1);
      mesh.material.emissiveIntensity = 0.5;
    }
  }

  // 懸停掃描:地面綠色掃描圈擴張收斂 + 探照燈增亮
  if (hoverHold && mode === 'play') {
    const t = Math.min(1, (hoverHold - now) / HOVER_MS);   // 1 -> 0
    const s = 0.5 + 1.3 * (1 - t);
    scanRing.position.x = drone.position.x;
    scanRing.position.z = drone.position.z;
    scanRing.scale.set(s, s, s);
    scanRing.material.opacity = 0.5 * (1 - t * t);
    searchLight.intensity = 0.9 + 1.2 * (1 - t);
  } else {
    scanRing.material.opacity = Math.max(0, scanRing.material.opacity - 0.02);
    searchLight.intensity = 0.9;
  }
  if (hoverHold && now >= hoverHold) { hoverHold = 0; lastPlayTime = now; }

  // 相機跟隨無人機(平滑追蹤校正位置)
  if (followCam) {
    const tgt = drone.position.clone().add(new THREE.Vector3(0, 0.7, 0));
    camTarget.lerp(tgt, 0.06);
    updateCameraFromSpherical();
  }

  if (mode === 'play' && playing && !hoverHold) {
    if (now - lastPlayTime > FRAME_INTERVAL_MS) {
      lastPlayTime = now;
      playFrame++;
      if (playFrame >= N) { playFrame = 0; currentWaypointIdx = 0; }
      setFrame(playFrame);
    }
  }

  renderer.render(scene, camera);
}
requestAnimationFrame(animate);
</script>
