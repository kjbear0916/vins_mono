# Docker Compose for the disaster-drone indoor rescue simulation (v2 spec).
#
# Two service split (spec §4): 
#   1. gazebo      — Gazebo Harmonic + PX4 SITL (flight control + world + sensors)
#   2. ros_nodes   — all ROS2 perception/navigation/mission nodes
#
# Network: host mode. This is the correct choice under WSL2 and native Linux
# (gz transport discovery is multicast; PX4 SITL binds 14540/14557 UDP on
# localhost). If you run Docker Desktop on macOS/Windows with the VM isolation
# model, use docker-compose.bridge.yml instead (bridge + published ports).
#
# Phase selection: the world file loaded by Gazebo is chosen with PX4_GZ_WORLD.
# World name must match the file basename (three_floor_building.sdf -> world
# name "three_floor_building"). Variant worlds (occlusion/survivor tests) are
# generated by tools/gen_world.py; set PX4_GZ_WORLD accordingly.

x-disaster-base: &disaster-base
  build: .
  environment: &base-env
    - DISPLAY=${DISPLAY:-:0}
    - ROS_DOMAIN_ID=0
    - PYTHONUNBUFFERED=1
    - GZ_SIM_RESOURCE_PATH=/workspace/disaster_drone_ws/src/drone_bringup/models:/workspace/disaster_drone_ws/src/drone_bringup/worlds:/opt/PX4-Autopilot/Tools/simulation/gz/models
  volumes: &base-volumes
    # Live workspace (source is on the Windows/WSL side, keep edits flowing in)
    - ./src:/workspace/disaster_drone_ws/src
    - ./tools:/workspace/disaster_drone_ws/tools
    - ./artifacts:/workspace/disaster_drone_ws/artifacts
    - ./logs:/workspace/disaster_drone_ws/logs
    - /tmp/.X11-unix:/tmp/.X11-unix:rw
  ipc: host
  init: true
  network_mode: host
  env_file: ./.env

services:
  # ── Gazebo Harmonic + PX4 SITL ─────────────────────────────────────────
  gazebo:
    <<: *disaster-base
    container_name: disaster_gazebo
    command: >
      bash -c "
        set -euo pipefail
        ln -sfn /workspace/disaster_drone_ws/src/drone_bringup/worlds/$${PX4_GZ_WORLD}.sdf
              /opt/PX4-Autopilot/Tools/simulation/gz/worlds/$${PX4_GZ_WORLD}.sdf
        cd /opt/PX4-Autopilot
        export PX4_GZ_WORLD=$${PX4_GZ_WORLD:-three_floor_building}
        make px4_sitl gz_x500
      "

  # ── ROS2 nodes (bridge + perception + navigation + mission) ────────────
  ros_nodes:
    <<: *disaster-base
    container_name: disaster_ros_nodes
    depends_on:
      - gazebo
    command: >
      bash -c "
        set -euo pipefail
        sleep 5
        source /workspace/disaster_drone_ws/install/setup.bash || true
        ros2 launch drone_bringup full_system.launch.py
      "

  # ── Interactive dev shell (docker compose run dev bash) ────────────────
  dev:
    <<: *disaster-base
    container_name: disaster_dev
    profiles: ["dev"]
    command: ["bash"]