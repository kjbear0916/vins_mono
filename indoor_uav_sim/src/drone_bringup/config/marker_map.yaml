# marker_map.yaml
# marker_id = floor(1 digit) * 100 + room(1 digit)*10 + waypoint_index(1 digit)
# Room 9 = stairwell/atrium. IDs 900..999 = survivor markers.
#
# Marker pose is the FLOOR-MOUNTED world pose (nadir camera reads floor
# markers, spec section 5.5). z datum per floor = walking surface + 0.05:
#   1F -> 0.25, 2F -> 3.25, 3F -> 6.25  (surface = storey*3 + 0.2)
# Flight target altitudes are NOT these z values; see navigation_params.yaml.
#
# Stairwell markers: 109 sits on the solid F1 slab at the shaft centre
# (x[-8,-6], y[-4,0]); 209/309 sit just EAST of the F2/F3 shaft opening so a
# nadir camera re-acquires them after the vertical climb.

markers:
  # ===== 1F (walking surface z=0.2, marker datum 0.25) =====
  # Room 0: corridor (markers along y=-1)
  100: {x: -8.0, y: -1.0, z: 0.25, yaw: 0.0}
  101: {x: -5.0, y: -1.0, z: 0.25, yaw: 0.0}
  102: {x: -2.0, y: -1.0, z: 0.25, yaw: 0.0}
