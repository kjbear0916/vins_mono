# mission_waypoints.yaml
# Ordered list of waypoints for the exploration mission.
# floor: floor number (1, 2, 3)
# marker_id: marker ID to navigate toward
# action: what to do at this waypoint
# vertical: true if this is a vertical (stairwell) transition

mission:
  name: "3_floor_search"
  description: "Explore all 3 floors via stairwell, detect survivors"

  waypoints:
    # 1F exploration
    - {id: 1, floor: 1, marker_id: 100, action: "navigate", vertical: false}
    - {id: 2, floor: 1, marker_id: 101, action: "navigate", vertical: false}
    - {id: 3, floor: 1, marker_id: 102, action: "navigate", vertical: false}
