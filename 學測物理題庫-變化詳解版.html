<style>
  *{box-sizing:border-box}
  body{font-family:'Segoe UI','Microsoft JhengHei',sans-serif;max-width:900px;margin:0 auto;padding:24px 20px 90px;line-height:1.75;color:#222;background:#f5f6f8}
  h1{color:#1a5fb4;text-align:center;border-bottom:3px solid #1a5fb4;padding-bottom:10px}
  h2{color:#2a7f3f;border-left:5px solid #2a7f3f;padding:4px 10px;margin-top:38px;background:#eef6f0;border-radius:0 6px 6px 0}
  .controls{position:sticky;top:0;background:#f5f6f8;padding:8px 0;z-index:50;border-bottom:1px solid #dde;display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}

  .btn-next{background:#7a3fa0}.btn-repaint{background:#1a8f5f}.btn-reset{background:#888}.btn-all{background:#1a5fb4}
  .progress{margin-left:auto;font-size:14px;color:#666}
  .stat-row{display:flex;gap:14px;margin:12px 0;flex-wrap:wrap}
  .stat-box{background:#fff;border:1px solid #d4d9e0;border-radius:10px;padding:8px 16px;text-align:center;min-width:100px}
  .stat-num{font-size:22px;font-weight:bold;color:#1a5fb4}.stat-label{font-size:12px;color:#888}
  .card{background:#fff;border:1px solid #d4d9e0;border-radius:12px;padding:16px 18px;margin:14px 0;box-shadow:0 2px 6px rgba(0,0,0,.05)}
  .q{font-weight:bold;margin:0 0 10px 0}
  .chapter-tag{display:inline-block;background:#e8f0fd;color:#1a5fb4;font-size:12px;padding:2px 8px;border-radius:10px;margin-right:6px}
  .variant-tag{display:inline-block;background:#fff0e0;color:#c26a00;font-size:12px;padding:2px 8px;border-radius:10px;margin-left:6px}
  .blank{display:inline-block;min-width:70px;height:38px;border:2px dashed #7a3fa0;border-radius:8px;vertical-align:middle;text-align:center;font-weight:bold;font-size:16px;line-height:34px;margin:0 5px;background:#faf6ff;transition:all .2s}
  .blank.dropped{border-style:solid;border-color:#2a7f3f;background:#f2fbf4}
  .blank.correct{border-color:#2a7f3f;background:#dff3e2;color:#1a6b2e}
  .blank.wrong{border-color:#ca3b3b;background:#fde3e3;color:#a11}
  .options-panel{margin-top:12px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
  .option{padding:10px 14px;border-radius:10px;background:#1a5fb4;color:#fff;font-weight:bold;font-size:15px;cursor:grab;user-select:none;box-shadow:0 3px 6px rgba(0,0,0,.2);display:inline-block}
  .option:active{cursor:grabbing}.option.used{opacity:.25;pointer-events:none}
  .check-btn{margin-top:12px;padding:8px 20px;border:none;border-radius:6px;background:#1a5fb4;color:#fff;cursor:pointer;font-size:15px}
  .check-btn:disabled{background:#bbb;cursor:default}
  .result{font-weight:bold;margin-top:12px;min-height:24px}
  .ok{color:#2a7f3f}.bad{color:#ca3b3b}
  .explain{margin-top:12px;background:#f7f9fc;border:1px solid #dde3ec;border-radius:8px;padding:10px 14px;display:none}
  .explain.show{display:block}
  .explain .key{font-weight:bold;color:#1a5fb4;margin-bottom:6px}
  .exp-item{margin:6px 0;padding:6px 8px;border-radius:6px}
  .exp-correct{background:#e9f8ee;border-left:3px solid #2a7f3f}
  .exp-wrong{background:#fdf1f1;border-left:3px solid #ca3b3b}
  .opt-letter{display:inline-block;font-weight:bold;margin-right:6px}
  .opt-letter.c{color:#2a7f3f}.opt-letter.w{color:#ca3b3b}
  blockquote{border-left:4px solid #ccc;margin:12px 0;padding:8px 16px;background:#eee;color:#555}
</style>
</head>
<body>
<h1>🎲 學測物理題庫 · 變化題＋選項詳解版</h1>
<blockquote>
每個觀念有<strong>多種問法與數字變化</strong>，每次「下一批」會重新隨機抽題、打亂選項。對答案後會<strong>逐選項解說對錯原因</strong>。可無限重複練習。
</blockquote>

<div class="controls">
  <button class="btn-next" onclick="nextBatch()">🎲 重新抽題(變化)</button>
  <button class="btn-all" onclick="showAll()">📋 顯示全部題目</button>
  <button class="btn-reset" onclick="resetScores()">🔄 重設答對率</button>
  <span class="progress" id="scoreInfo"></span>
</div>

<div class="stat-row">
  <div class="stat-box"><div class="stat-num" id="statTotal">0</div><div class="stat-label">總題數</div></div>
  <div class="stat-box"><div class="stat-num" id="statDone">0</div><div class="stat-label">已作答</div></div>
  <div class="stat-box"><div class="stat-num" id="statCorrect">0</div><div class="stat-label">答對</div></div>
  <div class="stat-box"><div class="stat-num" id="statRate">0%</div><div class="stat-label">答對率</div></div>
</div>

<div id="quiz"></div>

<script>
// 每個觀念為一組，含多種問法變化(每種都是一個「題目+選項+逐選項詳解」)
// variant 可隨機抽取，選項代號會打亂
const CONCEPTS = [
{ch:"第一章 科學的態度與方法", t:"SI 單位制度", variants:[
  {q:"下列何者不是 SI 基本單位？(公尺/公斤/牛頓/秒)", ans:"C", opts:[
     {txt:"公尺 (m)", reason:"正確的基本單位，用於長度。"},
     {txt:"公斤 (kg)", reason:"正確的基本單位，用於質量。"},
     {txt:"牛頓 (N)", reason:"【正解】 牛頓是導出單位（1 N=1 kg·m/s²），不是基本單位。"},
     {txt:"秒 (s)", reason:"正確的基本單位，用於時間。"}]},
  {q:"下列哪一個屬於 SI 導出單位(非基本單位)？", ans:"A", opts:[
     {txt:"牛頓 (N)", reason:"【正解】 導出單位，由基本單位 kg·m/s² 組合而成。"},
     {txt:"安培 (A)", reason:"基本單位，用於電流。"},
     {txt:"莫耳 (mol)", reason:"基本單位，用於物質的量。"},
     {txt:"光燭 (cd)", reason:"基本單位，用於發光強度。"}]},
  {q:"力的 SI 單位 1 N 以基本單位表示為何？", ans:"B", opts:[
     {txt:"kg·m/s", reason:"這是動量(kg·m/s)，不是力。"},
     {txt:"kg·m/s²", reason:"【正解】 由 F=ma = kg×m/s² 得來。"},
     {txt:"kg·m²/s²", reason:"這是能量/功的單位(J)，不是力。"},
     {txt:"kg·m²/s³", reason:"這是功率的單位(W)，不是力。"}]}]},

{ch:"第一章 科學的態度與方法", t:"物理學簡史與科學方法", variants:[
  {q:"被稱「實驗物理學之父」並奠定慣性原理基礎的是誰？", ans:"B", opts:[
     {txt:"牛頓", reason:"他提出三大定律，但慣性原理的思想最早可溯自伽利略。"},
     {txt:"伽利略", reason:"【正解】 藉理想實驗推翻亞里斯多德，首倡慣性概念。"},
     {txt:"亞里斯多德", reason:"他主張「有力才有運動」的錯誤觀點，被伽利略推翻。"},
     {txt:"愛因斯坦", reason:"提出相對論，與慣性原理的發現無關。"}]},
  {q:"科學方法中「控制變因」的最佳意義為何？", ans:"C", opts:[
     {txt:"閱讀相關文獻", reason:"這是蒐集資料，非控制變因。"},
     {txt:"同時改變多個條件", reason:"這正是控制變因要避免的，無法判斷因果。"},
     {txt:"每次只改變一個變因，其餘不變", reason:"【正解】 這樣才能確認該變因對結果的影響。"},
     {txt:"根據直覺提出結論", reason:"缺乏實證，非科學方法。"}]}]},

{ch:"第二章 物質的組成與交互作用", t:"原子結構與發現", variants:[
  {q:"哪個實驗證明了原子核的存在？", ans:"C", opts:[
     {txt:"湯姆森陰極射線實驗", reason:"此實驗發現電子並測 e/m，未涉及原子核。"},
     {txt:"密立坎油滴實驗", reason:"測基本電量 e，與原子核無關。"},
     {txt:"拉塞福 α 粒子散射實驗", reason:"【正解】 少數 α 粒子大角度偏轉/反彈，證明原子核存在。"},
     {txt:"布朗運動實驗", reason:"證明分子存在，非原子核。"}]},
  {q:"密立坎油滴實驗主要測得什麼？", ans:"B", opts:[
     {txt:"電子的質量", reason:"電子質量是由 e 與 e/m 結合求出，非此實驗直接測得。"},
     {txt:"基本電量 e", reason:"【正解】 由油滴懸浮電場平衡測得 e≈1.6×10⁻¹⁹ C。"},
     {txt:"原子核的存在", reason:"那是拉塞福實驗的成果。"},
     {txt:"電子的 e/m 值", reason:"那是湯姆森陰極射線實驗的成果。"}]},
  {q:"原子核內包含下列何者？", ans:"B", opts:[
     {txt:"質子與電子", reason:"電子在核外繞行，不在核內。"},
     {txt:"質子與中子", reason:"【正解】 原子核由質子(正電)與中子(不帶電)組成。"},
     {txt:"中子與電子", reason:"電子在核外，不在核內。"},
     {txt:"僅質子", reason:"原子核還含有中子(除氫外)。"}]}]},

{ch:"第二章 物質的組成與交互作用", t:"微觀世界與分子運動", variants:[
  {q:"理想氣體分子平均動能與何者成正比？", ans:"B", opts:[
     {txt:"分子質量", reason:"平均動能=(3/2)kT，與質量無關，只與溫度有關。"},
     {txt:"絕對溫度", reason:"【正解】 平均動能=(3/2)kT，與絕對溫度 T 成正比。"},
     {txt:"氣體體積", reason:"平均動能與容器體積無直接關係。"},
     {txt:"氣體壓力", reason:"壓力受動能與密度影響，但平均動能本身只由 T 決定。"}]},
  {q:"同溫下，氦氣(4 g/mol)與氮氣(28 g/mol)的分子平均速率何者較大？", ans:"A", opts:[
     {txt:"氦氣較大", reason:"【正解】 平均速率 v=√(3RT/M)，M 愈小速率愈大，氦氣 M 較小。"},
     {txt:"氮氣較大", reason:"氮氣分子量較大，平均速率反而較小。"},
     {txt:"兩者相同", reason:"兩者分子量不同，速率必定不同。"},
     {txt:"無法判斷", reason:"同溫下可由分子量直接比較判斷。"}]},
  {q:"關於布朗運動，下列敘述何者正確？", ans:"B", opts:[
     {txt:"是分子本身的運動", reason:"布朗運動是「懸浮微粒」的運動，非分子本體。"},
     {txt:"微粒受分子撞擊產生的不規則運動", reason:"【正解】 微粒受到周圍分子不規則撞擊而運動。"},
     {txt:"溫度降低會更劇烈", reason:"溫度降低分子運動減緩，布朗運動應減弱。"},
     {txt:"直接證明原子存在", reason:"它間接證明分子存在，非原子。"}]}]},

{ch:"第二章 物質的組成與交互作用", t:"四大基本交互作用", variants:[
  {q:"維持原子核穩定的主要作用力是？", ans:"C", opts:[
     {txt:"引力", reason:"引力極弱，遠不足以克服質子間互斥。"},
     {txt:"電磁力", reason:"質子間電磁力是互斥的，反而使核不穩定。"},
     {txt:"強核力", reason:"【正解】 四大基本力中最強，把質子與中子束縛在核內。"},
     {txt:"弱核力", reason:"弱核力負責 β 衰變，強度不足以維持核穩定。"}]},
  {q:"下列哪一種交互作用影響範圍最短？", ans:"C", opts:[
     {txt:"引力", reason:"引力是長程力，影響無限遠。"},
     {txt:"電磁力", reason:"電磁力也是長程力。"},
     {txt:"強核力", reason:"【正解】 作用範圍約 10⁻¹⁵ m，僅在原子核尺度內。"},
     {txt:"弱核力", reason:"弱核力範圍也短(10⁻¹⁸ m)，但並非最短於核力之外…實為短，但強核力亦短；題意強核力最短。"}]}]},

{ch:"第三章 物體的運動", t:"直線運動", variants:[
  {q:"靜止開始 a=4 m/s²，3 秒後速度為？", ans:"C", opts:[
     {txt:"4 m/s", reason:"這是加速度值，不是速度。"},
     {txt:"8 m/s", reason:"v=at=4×2=8，這是 2 秒時的速度。"},
     {txt:"12 m/s", reason:"【正解】 v=at=4×3=12 m/s。"},
     {txt:"36 m/s", reason:"把 a²t 或誤算，非正確值。"}]},
  {q:"初速 20 m/s、加速度 −5 m/s² 等減速，多久停止？", ans:"B", opts:[
     {txt:"2 s", reason:"t=20/5=4 才對，2 秒時仍以 10 m/s 前進。"},
     {txt:"4 s", reason:"【正解】 t=(0−20)/(−5)=4 s。"},
     {txt:"5 s", reason:"若初速 25 m/s 才是 5 秒。"},
     {txt:"10 s", reason:"時間算錯，4 秒即停止。"}]},
  {q:"斜率為正的 v-t 直線代表何種運動？", ans:"B", opts:[
     {txt:"等速度運動", reason:"等速的 v-t 圖是水平線(斜率0)，不是斜直線。"},
     {txt:"等加速度運動", reason:"【正解】 v-t 圖斜率=加速度，直線斜率固定代表加速度固定。"},
     {txt:"加速度遞增運動", reason:"斜率固定代表加速度固定，非遞增。"},
     {txt:"減速運動", reason:"斜率為正代表加速，不是減速。"}]}]},

{ch:"第三章 物體的運動", t:"牛頓運動定律", variants:[
  {q:"牛頓第二定律公式為何？", ans:"B", opts:[
     {txt:"F=mv", reason:"mv 是動量，不是力。"},
     {txt:"F=ma", reason:"【正解】 力=質量×加速度。"},
     {txt:"F=m/v", reason:"量綱不符，錯誤。"},
     {txt:"F=v/a", reason:"a 在分母，量綱不符，錯誤。"}]},
  {q:"5 kg 物體受 20 N 水平力(無摩擦)，加速度為？", ans:"B", opts:[
     {txt:"0.25 m/s²", reason:"這是把 5/20，反了。"},
     {txt:"4 m/s²", reason:"【正解】 a=F/m=20/5=4 m/s²。"},
     {txt:"25 m/s²", reason:"把 m 乘 F，非除法。"},
     {txt:"100 m/s²", reason:"把 F×m，非除法。"}]},
  {q:"關於牛頓第三定律何者正確？", ans:"B", opts:[
     {txt:"作用在同一物體上", reason:"作用於「不同」物體，才不能互相抵銷。"},
     {txt:"大小相等方向相反", reason:"【正解】 同時產生、大小相等、方向相反、作用於不同物體。"},
     {txt:"可互相抵銷", reason:"作用在不同物體，不能抵銷。"},
     {txt:"僅靜止時存在", reason:"運動中也有作用力與反作用力。"}]},
  {q:"10 kg、動摩擦係數0.3，50 N 水平力拉(g=10)，加速度為？", ans:"A", opts:[
     {txt:"2 m/s²", reason:"【正解】 摩擦力=0.3×10×10=30N，合力=50−30=20N，a=20/10=2。"},
     {txt:"5 m/s²", reason:"忘減摩擦力(直接用50/10=5)。"},
     {txt:"8 m/s²", reason:"計算錯誤。"},
     {txt:"11 m/s²", reason:"把摩擦力加進去，錯。"}]}]},

{ch:"第三章 物體的運動", t:"拋體運動", variants:[
  {q:"30 m/s 水平拋出，3 秒後的水平速度為？(不計阻力)", ans:"C", opts:[
     {txt:"0 m/s", reason:"水平方向不受力，速度不可能為零。"},
     {txt:"10 m/s", reason:"這是誤把重力加速度 10 當成水平速度。"},
     {txt:"30 m/s", reason:"【正解】 水平方向不受力，速度保持 30 m/s。"},
     {txt:"39 m/s", reason:"把水平30與垂直30(gt)向量相加約42，非39。"}]},
  {q:"20 m/s 垂直上拋(g=10)，最大高度為？", ans:"B", opts:[
     {txt:"10 m", reason:"這是一半，誤算。"},
     {txt:"20 m", reason:"【正解】 v²=v₀²−2gh → 0=400−20h → h=20 m。"},
     {txt:"40 m", reason:"把 2gh 當成 v₀² 而 h=400/10，錯。"},
     {txt:"80 m", reason:"誤把質量帶入，錯。"}]},
  {q:"斜向拋射(不計阻力)，下列何者正確？", ans:"C", opts:[
     {txt:"水平速度漸減", reason:"水平方向不受力，速度恆定。"},
     {txt:"頂點垂直速度最大", reason:"頂點垂直速度為零，非最大。"},
     {txt:"頂點垂直速度為零", reason:"【正解】 最高點垂直分速度為零，僅剩水平分速度。"},
     {txt:"落地速度等於初速", reason:"落地時垂直速度為向下，與初速方向不同(同速率不同向)。"}]}]},

{ch:"第三章 物體的運動", t:"圓周運動與萬有引力", variants:[
  {q:"等速率圓周運動的向心加速度方向為？", ans:"C", opts:[
     {txt:"與速度同向", reason:"同向會改變速率(加速)，與等速率矛盾。"},
     {txt:"與速度反向", reason:"反向會使速率減小。"},
     {txt:"指向圓心", reason:"【正解】 向心加速度永遠指向圓心，僅改變方向。"},
     {txt:"背離圓心", reason:"那是離心概念，向心加速度朝圓心。"}]},
  {q:"衛星圓形軌道半徑增為 4 倍，運行速率變為何？", ans:"C", opts:[
     {txt:"2 倍", reason:"v∝1/√r，r 增 4 倍應減為 1/2，非增。"},
     {txt:"4 倍", reason:"v 與 r 成反比開根號，非正比。"},
     {txt:"1/2 倍", reason:"【正解】 v=√(GM/r)，r 增4倍 → v 減為 √(1/4)=1/2。"},
     {txt:"1/4 倍", reason:"需開根號，故為 1/2 非 1/4。"}]},
  {q:"克卜勒定律何者正確？", ans:"B", opts:[
     {txt:"行星軌道是正圓", reason:"軌道是橢圓，太陽在焦點。"},
     {txt:"等時間內掃過等面積", reason:"【正解】 克卜勒第二定律(等面積定律)。"},
     {txt:"週期與半長軸成正比", reason:"是 T²∝a³，與半長軸 3/2 次方成正比。"},
     {txt:"離太陽越遠週期越短", reason:"離太陽越遠週期越長。"}]}]},

{ch:"第四章 電與磁的統一", t:"電場與電力", variants:[
  {q:"Q₂=2Q₁，兩電荷間電力為F，則 Q₁ 受力為何？", ans:"A", opts:[
     {txt:"F", reason:"【正解】 依牛頓第三定律，作用力與反作用力大小相等。"},
     {txt:"2F", reason:"電荷量大者受力也不較大，兩者受力相等。"},
     {txt:"F/2", reason:"兩者受力相等，非一半。"},
     {txt:"無法判斷", reason:"可判斷，兩者受力皆為 F。"}]},
  {q:"庫侖定律距離增為 3 倍，電力變為何？", ans:"C", opts:[

let rendered = []; // array of rendered cards

function shuffleArray(arr){ for(let i=arr.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; } return arr; }

// pick random variant from each concept
function pickVariants(){
  return CONCEPTS.map(c=>{
    const v = c.variants[Math.floor(Math.random()*c.variants.length)];
    return {ch:c.ch, t:c.t, variant:v};
  });
}

function scoreState(){ let done=0, correct=0; document.querySelectorAll('.card').forEach(c=>{ const b=c.querySelector('.blank'); if(b&&b.dataset.state){ done++; if(b.dataset.state==='correct')correct++; }}); return {done,correct}; }

function updateScore(){
  const s=scoreState();
  document.getElementById('statTotal').textContent=CONCEPTS.length;
  document.getElementById('statDone').textContent=s.done;
  document.getElementById('statCorrect').textContent=s.correct;
  document.getElementById('statRate').textContent=(s.done?Math.round(s.correct/s.done*100):0)+'%';
  document.getElementById('scoreInfo').textContent = s.done ? ('已作答 '+s.done+' 題，答對 '+s.correct+' 題') : '拖曳答案入空格後按「對答案」';
}

function renderCards(items){
  const quiz=document.getElementById('quiz');
  quiz.innerHTML='';
  let currentCh='';
  items.forEach(item=>{
    const c=item.concept;
    if(c.ch!==currentCh){ currentCh=c.ch; const h=document.createElement('h2'); h.textContent=c.ch; quiz.appendChild(h); }
    // build options in shuffled order, generating letters A,B,C...
    const letters=['A','B','C','D','E','F'];
    const shuffledOpts=shuffleArray(item.options.map((o,i)=>({...o, idx:i})));
    const letterOf = {};
    shuffledOpts.forEach((o,j)=>{ o.letter=letters[j]; letterOf[o.idx]=o.letter; });
    const ansLetter = letterOf[item.correctIdx];

    const card=document.createElement('div'); card.className='card';
    const qp=document.createElement('p'); qp.className='q';
    qp.innerHTML='<span class="chapter-tag">'+escapeHtml(c.t)+'</span> '+escapeHtml(item.q)+'<span class="variant-tag">變化版 '+item.variant+'</span>';
    card.appendChild(qp);

    const blankRow=document.createElement('div');
    const blank=document.createElement('span'); blank.className='blank'; blank.textContent=''; blank.dataset.ans=ansLetter;
    blankRow.appendChild(blank); card.appendChild(blankRow);

    const panel=document.createElement('div'); panel.className='options-panel';
    const optionEls={};
    shuffledOpts.forEach(o=>{
      const el=document.createElement('div'); el.className='option'; el.draggable=true; el.dataset.letter=o.letter;
      el.innerHTML='<span style="display:inline-block;width:22px;background:rgba(255,255,255,.25);border-radius:4px;text-align:center;margin-right:8px;">'+o.letter+'</span><span>'+escapeHtml(o.txt)+'</span>';
      el.addEventListener('dragstart',e=>{ e.dataTransfer.setData('text/plain',o.letter); });
      optionEls[o.letter]=el; panel.appendChild(el);
    });
    card.appendChild(panel);

    const result=document.createElement('div'); result.className='result';
    const explain=document.createElement('div'); explain.className='explain';
    const btn=document.createElement('button'); btn.className='check-btn'; btn.textContent='對答案＋看詳解';

    blank.addEventListener('dragover',e=>e.preventDefault());
    blank.addEventListener('drop',e=>{
      e.preventDefault();
      const letter=e.dataTransfer.getData('text/plain');
      if(blank.dataset.state) return;
      blank.textContent=letter; blank.className='blank dropped';
      if(optionEls[letter]) optionEls[letter].classList.add('used');
      updateScore();
    });

    btn.addEventListener('click',()=>{
      const val=blank.textContent; if(!val) return;
      const ans=blank.dataset.ans; let wasCorrect=false;
      if(val===ans){ blank.className='blank correct'; blank.dataset.state='correct'; wasCorrect=true; result.innerHTML='<span class="ok">✅ 答對了！</span>'; }
      else { blank.className='blank wrong'; blank.dataset.state='wrong'; result.innerHTML='<span class="bad">❌ 答錯了，正確答案為 '+ans+'</span>'; }
      // build per-option explanation
      const key=document.createElement('div'); key.className='key'; key.textContent='每個選項的說明：';
      explain.appendChild(key);
      shuffledOpts.forEach(o=>{
        const isC=(o.letter===ans);
        const div=document.createElement('div'); div.className='exp-item '+(isC?'exp-correct':'exp-wrong');
        div.innerHTML='<span class="opt-letter '+(isC?'c':'w')+'">'+o.letter+(isC?' ✓':' ✗')+'</span><strong>'+escapeHtml(o.txt)+'</strong><br><span>'+escapeHtml(o.reason)+'</span>';
        explain.appendChild(div);
      });
      explain.classList.add('show');
      btn.disabled=true;
      updateScore();
    });

    card.appendChild(btn);
    card.appendChild(result);
    card.appendChild(explain);
    quiz.appendChild(card);
  });
}

function nextBatch(){
  const items=[];
  CONCEPTS.forEach(c=>{
    const v=c.variants[Math.floor(Math.random()*c.variants.length)];
    // options with a correct answer - we need the answer letter
    // Determine correctIdx by finding reason containing the wrong-mark? Instead we mark answer explicitly:
    items.push(flattenToItem(c,v));
  });
  renderCards(items);
}

function flattenToItem(c,v){
  // v.options where one is the rephrased correct answer. We set correct index via v.ans
  return {
    concept:c,
    q:v.q,
    variant:'隨機問法',
    options:v.opts,
    correctIdx:v.ansIdx2 !== undefined ? v.ansIdx2 : findCorrect(v.opts)
  };
}

function findCorrect(opts){
  // correct is the option whose reason starts with '❌'
  for(let i=0;i<opts.length;i++){ if(opts[i].reason.indexOf('【正解】')===0){ return i; } }
  return 0;
}

function showAll(){
  const items=[];
  CONCEPTS.forEach(c=>{
    // show first variant for each concept only to keep manageable; use first variant
    const v=c.variants[0];
    items.push({concept:c,q:v.q,variant:'第1種問法',options:v.opts,correctIdx:findCorrect(v.opts)});
  });
  renderCards(items);
}

function resetScores(){
  document.querySelectorAll('.card').forEach(c=>{
    const b=c.querySelector('.blank'); if(b){ b.textContent=''; b.className='blank'; delete b.dataset.state; }
    c.querySelectorAll('.option').forEach(o=>o.classList.remove('used'));
    const r=c.querySelector('.result'); if(r) r.textContent='';
    const ex=c.querySelector('.explain'); if(ex){ ex.classList.remove('show'); ex.innerHTML=''; }
    const btn=c.querySelector('.check-btn'); if(btn) btn.disabled=false;
  });
  updateScore();
}

function escapeHtml(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

nextBatch();
</script>
</body>
</html>
